name: Deploy GW Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify static release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$(cat RELEASE)" --pattern gw-site.tar.gz --pattern gw-site.tar.gz.sha256
          sha256sum -c gw-site.tar.gz.sha256
          mkdir site
          tar -xzf gw-site.tar.gz -C site
          test "$(cat site/society/initial-world.json)" = null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
